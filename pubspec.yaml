  latlong2: ^0.9.0
  mapbox_maps_flutter: ^2.28.0
  geolocator: ^14.0.3
  location: ^5.0.0

  # Social Sign-In
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0

  # State Management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  rxdart: ^0.28.0

  # Storage
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2+1
  path: ^1.9.1
